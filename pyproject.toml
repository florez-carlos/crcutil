[build-system]
requires = ["setuptools>=84","setuptools_scm>=10"]
build-backend = "setuptools.build_meta"

[project]
name = "crcutil"
version = "3.0.1"
requires-python = ">=3.12"
authors = [
  {name = "Carlos Florez", email = "mail@florezcarlos.com"}
]
maintainers = [
  {name = "Carlos Florez", email = "mail@florezcarlos.com"}
]
description = ""
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "alive-progress==3.3.0",
  "pyyaml==6.0.3",
  "toml==0.10.2",
  "pywin32==311;sys_platform == 'win32'",
  "jsonschema==4.25.1",
  "colorlog==6.12.0",
  "pynput==1.8.2",
  "python-xlib==0.33",
  "evdev==2.0.0;sys_platform == 'linux'",
  "pyobjc-framework-Cocoa==12.2.2;sys_platform == 'darwin'",
  "msgspec==0.22.0",
]

[project.scripts]
crcutil = "crcutil.__main__:main"

[project.urls]
Repository = "https://github.com/florez-carlos/crcutil"
